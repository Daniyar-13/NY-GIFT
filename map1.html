<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>MAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ===== ПЕРЕХОД С ЧЁРНЫМИ ПОЛОСАМИ ===== */
    @keyframes pageExit {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes slideInTop {
      from { transform: translateY(-100%); }
      to   { transform: translateY(0); }
    }
    @keyframes slideInBottom {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    html.page-exit body {
      animation: pageExit 1s ease-in-out forwards;
    }
    html.page-exit::before,
    html.page-exit::after {
      content: '';
      position: fixed;
      left: 0;
      width: 100%;
      height: 50vh;
      background: #000;
      z-index: 9999;
      animation: 1s ease-in-out forwards;
      pointer-events: none;
    }
    html.page-exit::before {
      top: 0;
      animation-name: slideInTop;
    }
    html.page-exit::after {
      bottom: 0;
      animation-name: slideInBottom;
    }

    /* ===== БАЗОВЫЙ ФОН И ЛЕЙАУТ ===== */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      background: #14054C;
      font-family: 'Montserrat', Arial, sans-serif;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .page-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 84px 24px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 15;
    }

    /* Боковые панели в потоке, чтобы не перекрывать карту */
    .side-panel {
      flex: 0 0 240px;
      height: min(680px, calc(100vh - 180px));
      background: rgba(10, 3, 45, 0.9);
      border-radius: 20px;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.5);
      padding: 20px 16px;
      color: #f7f3ff;
      font-size: 0.95rem;
      line-height: 1.6;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .side-panel-left h2 {
      margin: 0;
      font-weight: 600;
      color: #ffd76a;
      line-height: 2.2;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
      font-size: 30px;
    }

    .side-panel-right p {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 500;
      line-height: 1.9;
      color: #ffd76a;
    }

    /* Контейнер под масштаб карты */
    .map-stage {
      position: relative;
      flex: 0 0 auto;
    }

    .map-wrapper {
      position: relative;
      width: 1280px;
      height: 832px;
      transform-origin: top left;
      background-color: #14054C;
      background-image: url('images/MAP.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-size: 1280px 832px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      overflow: hidden;
    }

    /* Адаптив для узких экранов и мобильных */
    @media (max-width: 1100px) {
      body {
        overflow-y: auto;
        overflow-x: hidden;
        align-items: flex-start;
      }
      .page-layout {
        flex-direction: column;
        gap: 20px;
        padding: 84px 16px;
      }
      .side-panel {
        flex: none;
        width: 100%;
        max-width: 560px;
        height: auto;
        padding: 16px 20px;
      }
      .side-panel-left h2 {
        writing-mode: horizontal-tb;
        text-orientation: mixed;
        line-height: 1.3;
        font-size: 24px;
      }
      .side-panel-right p {
        line-height: 1.6;
      }
    }

    /* ===== ГИРЛЯНДЫ ПО КРАЯМ ЭКРАНА ===== */
    .garland-edge {
      position: fixed;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 20;
    }
    .garland-top {
      top: 0;
      height: 80px;
    }
    .garland-bottom {
      bottom: 0;
      height: 80px;
      transform: rotate(180deg);
    }

    .garland-line {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #ffe066, #ff6b6b, #74c0fc, #b197fc, #ff922b);
      opacity: 0.7;
    }
    .garland-bulbs {
      position: absolute;
      top: 22px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
    }
    .garland-bulb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff6b6b;
      box-shadow: 0 0 10px rgba(255, 107, 107, 0.9);
      animation: bulbBlink 1.6s ease-in-out infinite alternate;
    }
    .garland-bulb:nth-child(2) { background: #ffe066; box-shadow: 0 0 10px rgba(255, 224, 102, 0.9); animation-delay: .3s; }
    .garland-bulb:nth-child(3) { background: #69db7c; box-shadow: 0 0 10px rgba(105, 219, 124, 0.9); animation-delay: .6s; }
    .garland-bulb:nth-child(4) { background: #74c0fc; box-shadow: 0 0 10px rgba(116, 192, 252, 0.9); animation-delay: .9s; }
    .garland-bulb:nth-child(5) { background: #f783ac; box-shadow: 0 0 10px rgba(247, 131, 172, 0.9); animation-delay: 1.2s; }

    @keyframes bulbBlink {
      0%   { transform: translateY(0); opacity: .4; }
      100% { transform: translateY(5px); opacity: 1; }
    }

    /* ===== ПАДАЮЩИЙ СНЕГ ===== */
    .snow-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }
    .snowflake {
      position: absolute;
      top: -10%;
      color: rgba(255, 255, 255, 0.9);
      font-size: 12px;
      animation: snowFall linear infinite;
    }
    @keyframes snowFall {
      0%   { transform: translateY(-10vh); opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0.2; }
    }

    /* ===== КЛИКАБЕЛЬНЫЕ ЗОНЫ НА СТИКЕРАХ ===== */
    .hotspot {
      position: absolute;
      cursor: pointer;
      background: transparent;
      border-radius: 14px;
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
    }
    .hotspot:hover,
    .hotspot:focus-visible {
      background: rgba(255, 215, 106, 0.12);
      box-shadow: 0 0 18px rgba(255, 215, 106, 0.35);
      outline: none;
    }

    .hs-letter { top: 70px;  left: 410px;  width: 110px; height: 80px; }
    .hs-photos { top: 80px;  right: 350px; width: 110px; height: 130px; }
    .hs-cake   { top: 320px; left: 440px;  width: 130px; height: 90px; }
    .hs-heart  { top: 300px; right: 290px; width: 120px; height: 110px; }
    .hs-scroll { bottom: 235px; left: 30px; width: 210px; height: 110px; }
    .hs-star   { bottom: 80px; left: 440px; width: 120px; height: 150px; }
    .hs-book   { bottom: 120px; right: 230px; width: 180px; height: 150px; }

    /* ===== ОВЕРЛЕЙ С ВИДЕО ===== */
    .video-overlay {
      position: fixed;
      inset: 0;
      background: #1E1E1E;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .video-overlay video {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
    .video-skip {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2001;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .video-skip:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- Оверлей с видео для перехода к письму -->
  <div class="video-overlay" id="letterVideoOverlay">
    <video id="letterVideo" playsinline preload="auto">
      <source src="images/letter-intro.mp4" type="video/mp4">
    </video>
    <button class="video-skip" id="skipVideoBtn" type="button">Пропустить</button>
  </div>

  <!-- Гирлянды по краям окна -->
  <div class="garland-edge garland-top">
    <div class="garland-line"></div>
    <div class="garland-bulbs">
      <div class="garland-bulb"></div>
      <div class="garland-bulb"></div>
      <div class="garland-bulb"></div>
      <div class="garland-bulb"></div>
      <div class="garland-bulb"></div>
    </div>
  </div>

  <div class="garland-edge garland-bottom">
    <div class="garland-line"></div>
    <div class="garland-bulbs">
      <div class="garland-bulb"></div>
      <div class="garland-bulb"></div>
      <div class="garland-bulb"></div>
      <div class="garland-bulb"></div>
      <div class="garland-bulb"></div>
    </div>
  </div>

  <!-- Снег -->
  <div class="snow-layer" id="snowLayer"></div>

  <main class="page-layout">
    <aside class="side-panel side-panel-left">
      <h2>Happy New Year</h2>
    </aside>

    <div class="map-stage" id="mapStage">
      <div class="map-wrapper" id="mapWrapper">
        <a class="hotspot hs-letter" href="letter.html"   aria-label="Письмо"           title="Письмо"></a>
        <a class="hotspot hs-photos" href="photo.html"    aria-label="Фотографии"       title="Фотографии"></a>
        <a class="hotspot hs-cake"   href="birthday.html" aria-label="День рождения"    title="День рождения"></a>
        <a class="hotspot hs-heart"  href="love.html"     aria-label="Любовь"           title="Любовь"></a>
        <a class="hotspot hs-scroll" href="wishlist.html" aria-label="Список желаний"   title="Список желаний"></a>
        <a class="hotspot hs-star"   href="star.html"     aria-label="Звезда"           title="Звезда"></a>
        <a class="hotspot hs-book"   href="secret.html"   aria-label="Секретная книга"  title="Секретная книга"></a>
      </div>
    </div>

    <aside class="side-panel side-panel-right">
      <p>
        Это мини‑карта специально для тебя.<br>
        Каждая остановка на ней — кусочек нашей истории:<br>
        что‑то из прошлого и что‑то для будущего.<br>
        Надеюсь, тебе понравится это маленькое дополнение к моему подарку.
      </p>
    </aside>
  </main>

  <script>
    // Снег
    const snowLayer = document.getElementById('snowLayer');
    const FLAKES = 40;
    for (let i = 0; i < FLAKES; i++) {
      const s = document.createElement('span');
      s.className = 'snowflake';
      s.textContent = '❆';
      const duration = 8 + Math.random() * 7;
      s.style.left = Math.random() * 100 + '%';
      s.style.fontSize = (8 + Math.random() * 10) + 'px';
      s.style.animationDuration = duration + 's';
      s.style.animationDelay = (-Math.random() * duration) + 's';
      snowLayer.appendChild(s);
    }

    // Пропорциональное масштабирование карты без сдвига хотспотов
    const MAP_W = 1280;
    const MAP_H = 832;
    const mapStage = document.getElementById('mapStage');
    const mapWrapper = document.getElementById('mapWrapper');

    function resizeMap() {
      const isMobileLayout = window.innerWidth <= 1100;
      const sidePanelsWidth = isMobileLayout ? 32 : (240 * 2 + 24 * 2 + 48);
      const verticalPadding = isMobileLayout ? 40 : 168;

      const availW = Math.max(280, window.innerWidth - sidePanelsWidth);
      const availH = isMobileLayout ? Infinity : Math.max(240, window.innerHeight - verticalPadding);

      const scale = Math.min(1, availW / MAP_W, availH / MAP_H);
      mapWrapper.style.transform = `scale(${scale})`;
      mapStage.style.width = `${MAP_W * scale}px`;
      mapStage.style.height = `${MAP_H * scale}px`;
    }

    window.addEventListener('resize', resizeMap);
    resizeMap();

    // Переход с полосами
    let isTransitioning = false;

    function mapTransition(url) {
      if (isTransitioning) return;
      isTransitioning = true;
      document.documentElement.classList.add('page-exit');
      setTimeout(() => {
        window.location.href = url;
      }, 1000);
    }

    // Сброс анимации и видео при возврате кнопкой «Назад» (bfcache)
    const letterOverlay = document.getElementById('letterVideoOverlay');
    const letterVideo = document.getElementById('letterVideo');
    const skipVideoBtn = document.getElementById('skipVideoBtn');

    window.addEventListener('pageshow', (event) => {
      if (event.persisted || document.documentElement.classList.contains('page-exit')) {
        isTransitioning = false;
        document.documentElement.classList.remove('page-exit');
        letterOverlay.style.display = 'none';
        letterVideo.pause();
        letterVideo.currentTime = 0;
      }
    });

    // Обработка кликов по стикерам
    const hotspots = document.querySelectorAll('.hotspot');
    hotspots.forEach((el) => {
      const href = el.getAttribute('href');

      el.addEventListener('click', (e) => {
        e.preventDefault();
        if (isTransitioning) return;

        if (el.classList.contains('hs-letter')) {
          letterOverlay.style.display = 'flex';
          letterVideo.currentTime = 0;

          const finishVideo = () => mapTransition(href);
          letterVideo.onended = finishVideo;
          letterVideo.onerror = finishVideo;
          skipVideoBtn.onclick = () => {
            letterVideo.pause();
            finishVideo();
          };

          const playPromise = letterVideo.play();
          if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(finishVideo);
          }
        } else {
          mapTransition(href);
        }
      });
    });
  </script>

</body>
</html>
