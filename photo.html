<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поезд воспоминаний</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        @keyframes pageEnter {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes pageExit {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes slideInTop {
            from { transform: translateY(-100%); }
            to   { transform: translateY(0); }
        }
        @keyframes slideInBottom {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }

        html.page-exit body {
            animation: pageExit 1s ease-in-out forwards;
        }
        html.page-exit::before,
        html.page-exit::after {
            content: '';
            position: fixed;
            left: 0;
            width: 100%;
            height: 50vh;
            background: #000;
            z-index: 9999;
            animation: 1s ease-in-out forwards;
            pointer-events: none;
        }
        html.page-exit::before {
            top: 0;
            animation-name: slideInTop;
        }
        html.page-exit::after {
            bottom: 0;
            animation-name: slideInBottom;
        }

        :root {
            --color-primary: #8B4F5C;
            --color-secondary: #D4A5A5;
            --color-accent: #C49B73;
            --color-background: #F5F1ED;
            --color-text: #2C2C2C;
            --color-heading-bright: #C22929;

            --font-body: 'Montserrat', sans-serif;
            --font-script: 'Great Vibes', cursive;

            --spacing-lg: 2rem;
            --spacing-xl: 3rem;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.16);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            font-size: 1.125rem;
            font-weight: 300;
            line-height: 1.7;
            color: var(--color-text);
            background-color: var(--color-background);
            overflow-x: hidden;
            animation: pageEnter 1.2s ease-out;
        }

        .main-container {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding-bottom: 96px;
        }

        .background-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .dark-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.15) 0%,
                rgba(0, 0, 0, 0.25) 50%,
                rgba(0, 0, 0, 0.35) 100%
            );
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.3);
        }

        .month-header {
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-lg) var(--spacing-lg);
            animation: fadeInDown 1s ease-out;
            position: relative;
            z-index: 10;
        }

        .month-title {
            font-family: var(--font-script);
            font-size: 3.4rem;
            font-weight: 400;
            color: var(--color-heading-bright);
            letter-spacing: 0.04em;
            text-shadow:
                3px 3px 8px rgba(0, 0, 0, 0.7),
                1px 1px 3px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(139, 79, 92, 0.5);
        }

        /* ===== КАРУСЕЛЬ ===== */
        .carousel-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 24px 0;
            display: flex;
            align-items: center;
            overflow: hidden;
            animation: fadeIn 1.4s ease-out;
        }

        .carousel-track {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-left: 24px;
            width: max-content;
            will-change: transform;
        }

        .carousel-slide {
            flex: 0 0 clamp(210px, 18vw, 280px);
            height: clamp(280px, 42vh, 380px);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .carousel-slide:hover {
            transform: scale(1.04);
            box-shadow: var(--shadow-hover);
        }

        .carousel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .month-title {
                font-size: 2.4rem;
            }
            .carousel-track {
                gap: 16px;
                padding-left: 16px;
            }
            .carousel-slide {
                flex: 0 0 200px;
                height: 270px;
            }
        }

        /* ===== НИЖНИЕ КНОПКИ НАВИГАЦИИ ===== */
        .floating-nav {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            padding: 0 22px;
            display: flex;
            justify-content: space-between;
            z-index: 200;
            pointer-events: none;
        }

        .floating-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.75);
            background: rgba(248, 252, 255, 0.28);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #f8f9fa;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .floating-btn:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 7px 22px rgba(0, 0, 0, 0.38);
            background: rgba(248, 252, 255, 0.45);
        }

        .floating-btn .icon-map {
            font-size: 1.4rem;
            line-height: 1;
        }
    </style>
</head>
<body>

    <script>
        /* ========================================
           БЕСШОВНАЯ КАРУСЕЛЬ (НЕЗАВИСИМА ОТ Гц)
           ======================================== */
        const track = document.getElementById('carouselTrack');
        const wrapper = document.getElementById('carouselWrapper');

        const SPEED_PX_PER_SEC = 75;
        let position = 0;
        let halfWidth = 0;
        let isAutoScrolling = true;
        let lastTime = null;

        function measureTrack() {
            const firstSlide = track.children[0];
            const firstClone = track.children[20];
            if (firstSlide && firstClone) {
                halfWidth = firstClone.offsetLeft - firstSlide.offsetLeft;
            }
        }

        function animateCarousel(timestamp) {
            if (lastTime === null) lastTime = timestamp;
            const deltaSec = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (isAutoScrolling && halfWidth > 0) {
                position += SPEED_PX_PER_SEC * deltaSec;
                if (position >= halfWidth) {
                    position -= halfWidth;
                }
                track.style.transform = `translate3d(-${position}px, 0, 0)`;
            }

            requestAnimationFrame(animateCarousel);
        }

        window.addEventListener('load', () => {
            measureTrack();
            requestAnimationFrame(animateCarousel);
        });
        window.addEventListener('resize', measureTrack);

        wrapper.addEventListener('mouseenter', () => { isAutoScrolling = false; });
        wrapper.addEventListener('mouseleave', () => { isAutoScrolling = true; });
        wrapper.addEventListener('touchstart', () => { isAutoScrolling = false; }, { passive: true });
        wrapper.addEventListener('touchend', () => { isAutoScrolling = true; }, { passive: true });

        /* ========================================
           ПЕРЕХОДЫ И СБРОС BFCACHE
           ======================================== */
        let isTransitioning = false;

        window.addEventListener('pageshow', (event) => {
            if (event.persisted || document.documentElement.classList.contains('page-exit')) {
                isTransitioning = false;
                document.documentElement.classList.remove('page-exit');
            }
        });

        function handlePageTransition(event) {
            event.preventDefault();
            if (isTransitioning) return;
            isTransitioning = true;

            const href = event.currentTarget.getAttribute('href');
            document.documentElement.classList.add('page-exit');
            setTimeout(() => {
                window.location.href = href;
            }, 1000);
        }
    </script>
